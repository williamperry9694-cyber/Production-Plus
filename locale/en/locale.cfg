[mod-name]
production-plus=Production Plus

[mod-description]
production-plus=Replaces the production window with one that adds a Net panel (produced minus consumed) next to production and consumption, so you can see deficits and surpluses at a glance. Also adds search, a sortable table view, click-to-graph and pinning, lock and flip, quality filters, a Power tab with every electric network, CSV export, and a one-click switch back to vanilla. Built to look like vanilla and stay lightweight.

[mod-setting-name]
pp-window-mode=Production window
pp-graph-scale=Graph scale

[mod-setting-description]
pp-window-mode=Which window the production hotkey and toolbar button open.

[string-mod-setting]
pp-window-mode-plus=Production Plus (vanilla one click away)
pp-window-mode-vanilla=Vanilla (Production Plus one click away)
pp-window-mode-plus-only=Production Plus only (vanilla disabled)

